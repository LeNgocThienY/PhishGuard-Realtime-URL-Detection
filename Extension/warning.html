<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảnh báo</title>
    <style>
        html, body {
                height: 100%;
                overflow: hidden;
        }
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            text-align: center;

        }
        h1 {
            font-size: 52px;
            margin: 0 0 20px 0;
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 14px 28px;
            background: #fff;
            color: #b71c1c;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TRANG WEB NGUY HIỂM!</h1>
        <p>Trang này có thể đang đánh cắp thông tin của bạn hoặc chứa mã độc.</p>
        <p>Không nhập mật khẩu, thông tin cá nhân hoặc nhấp vào liên kết trên trang này.</p>
        <a href="#" id="backBtn" class="btn btn-secondary">⬅ Quay lại</a>
        <a href="#" id="continueBtn" class="btn">Tiếp tục truy cập</a>
    </div>
    <script src="warning.js"></script>
</body>
</html>
